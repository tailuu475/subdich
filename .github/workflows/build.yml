name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cai XcodeGen
        run: brew install xcodegen
      - name: Tao project Xcode
        run: xcodegen generate
      - name: Build (khong ky)
        run: |
          xcodebuild -project SubDich.xcodeproj -scheme SubDich -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Dong goi IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/SubDich.app Payload/
          zip -r SubDich.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SubDich-ipa
          path: SubDich.ipa
